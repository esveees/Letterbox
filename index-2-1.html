<html lang="en">
<head>

     CONFIGURATION — edit these before sending
     ============================================================ -->
<script>
  window.SITE_CONFIG = {
    SONG_URL: "./assets/until-i-found-you.mp3",
    EMAILJS_SERVICE_ID: "service_moc25gc",
    EMAILJS_TEMPLATE_ID: "template_pnwxy8j",
    EMAILJS_PUBLIC_KEY: "-b6mYSj6YCvli5ZbB"
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
  :root{
    --blush: #f7d9de;
    --blush-deep: #eab8c3;
    --cream: #fdf6ee;
    --warm-white: #fffaf5;
    --plum: #7a5468;
    --plum-soft: #a5798d;
    --lilac: #e6d9f0;
    --ink: #5a4452;
    --shadow: rgba(122, 84, 104, 0.18);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  @font-face{
    font-family: 'FancyScript';
  }

  body{
    background: linear-gradient(-45deg, var(--cream), var(--blush), var(--lilac), var(--warm-white));
    background-size: 400% 400%;
    animation: driftBg 22s ease infinite;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }

  @keyframes driftBg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  #particles{
    position: fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;
  }
  .particle{
    position:absolute; opacity:0.55; will-change: transform;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(10vh) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.5; }
    100%{ transform: translateY(-110vh) translateX(20px) rotate(200deg); opacity:0; }
  }

  .stage{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 560px;
    padding: 28px;
  }

  .card{
    background: rgba(255,250,245,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 48px 36px;
    box-shadow: 0 18px 50px var(--shadow), 0 0 0 1px rgba(255,255,255,0.5) inset;
    text-align: center;
    animation: cardIn 0.7s cubic-bezier(.2,.8,.2,1);
  }

  @keyframes cardIn{
    from{ opacity:0; transform: translateY(18px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  h1,h2{
    font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    color: var(--plum);
    letter-spacing: 0.01em;
  }

  .line{
    font-size: 1.35rem;
    line-height: 1.6;
    margin: 0 0 14px 0;
    opacity: 0;
    animation: fadeLine 0.8s ease forwards;
  }

  @keyframes fadeLine{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .question-number{
    font-size: 0.85rem;
    color: var(--plum-soft);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .question-text{
    font-size: 1.7rem;
    line-height: 1.4;
    color: var(--plum);
    margin: 10px 0 30px 0;
  }

  .progress{
    font-size: 0.95rem;
    letter-spacing: 2px;
    margin-bottom: 26px;
    opacity: 0.85;
  }

  .btn-row{
    display:flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  button.choice, button.primary{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.15rem;
    padding: 14px 30px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--blush), var(--blush-deep));
    color: var(--plum);
    box-shadow: 0 6px 18px var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    min-width: 200px;
  }

  button.choice:hover, button.primary:hover{
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 10px 24px var(--shadow);
  }
  button.choice:active, button.primary:active{
    transform: translateY(0) scale(0.98);
  }

  button.primary{
    background: linear-gradient(135deg, var(--plum-soft), var(--plum));
    color: var(--warm-white);
    font-size: 1.2rem;
  }

  button:disabled{ opacity: 0.6; cursor: not-allowed; transform:none; }

  .reaction{
    margin-top: 22px;
    font-size: 1.2rem;
    color: var(--plum);
    min-height: 1.6em;
    opacity: 0;
    animation: fadeLine 0.6s ease forwards;
  }

  textarea{
    width: 100%;
    min-height: 140px;
    border-radius: 18px;
    border: 1px solid var(--blush-deep);
    background: rgba(255,255,255,0.7);
    padding: 16px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.15rem;
    color: var(--ink);
    resize: vertical;
    outline: none;
  }
  textarea:focus{ border-color: var(--plum-soft); box-shadow: 0 0 0 3px rgba(165,121,141,0.15); }

  .privacy-note{
    font-size: 0.85rem;
    color: var(--plum-soft);
    margin-top: 14px;
    opacity: 0.85;
  }

  .envelope-wrap{
    display:flex; justify-content:center; margin: 30px 0;
  }
  .envelope{
    width: 160px; height: 110px;
    position: relative;
    cursor: pointer;
    animation: floatEnv 3.5s ease-in-out infinite;
    filter: drop-shadow(0 10px 20px var(--shadow));
  }
  @keyframes floatEnv{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-10px); }
  }
  .envelope svg{ width:100%; height:100%; }
  .glow{
    position:absolute; inset:-20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247,217,222,0.6), transparent 70%);
    z-index:-1;
    animation: pulseGlow 2.5s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ opacity:0.6; transform: scale(1); }
    50%{ opacity:1; transform: scale(1.1); }
  }

  .letter{
    text-align: left;
    max-height: 55vh;
    overflow-y: auto;
    padding: 28px 24px;
    line-height: 1.9;
    font-size: 1.15rem;
    background: linear-gradient(165deg, rgba(255,255,255,0.6), rgba(247,217,222,0.4) 60%, rgba(230,217,240,0.35));
    border: 1px solid rgba(234,184,195,0.65);
    border-radius: 22px;
    box-shadow: 0 4px 24px rgba(122,84,104,0.1) inset;
  }
  .letter-flourish{
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 18px !important;
    opacity: 0;
    animation: fadeLine 0.9s ease forwards;
    letter-spacing: 4px;
  }
  .letter p{ margin: 0 0 15px 0; opacity:0; animation: fadeLine 0.9s ease forwards; }
  .letter-emphasis{
    font-size: 1.4rem !important;
    font-weight: 600;
    font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
    background: linear-gradient(90deg, #d9748d, #a5798d, #7a5468);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    letter-spacing: 0.01em;
  }
  .letter-heart{
    font-size: 2.2rem !important;
    text-align: center;
    margin: 10px 0 !important;
    filter: drop-shadow(0 2px 6px rgba(217,116,141,0.4));
  }
  .letter-signoff{
    font-size: 1.3rem !important;
    font-weight: 600;
    text-align: center;
    margin-top: 20px !important;
  }

  .music-toggle{
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 5;
    background: rgba(255,250,245,0.85);
    border: 1px solid var(--blush-deep);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 0.95rem;
    color: var(--plum);
    cursor: pointer;
    box-shadow: 0 6px 16px var(--shadow);
    display: inline-block;
  }

  .loader{
    display:inline-block; width:16px; height:16px;
    border: 2px solid var(--blush-deep);
    border-top-color: var(--plum);
    border-radius:50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .small-link{
    margin-top: 26px;
    font-size: 0.95rem;
    color: var(--plum-soft);
    cursor: pointer;
    text-decoration: underline;
    opacity: 0.8;
  }
  .small-link:hover{ opacity: 1; }

  @media (max-width: 480px){
    .card{ padding: 36px 22px; border-radius: 22px; }
    .question-text{ font-size: 1.4rem; }
    .line{ font-size: 1.15rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    .envelope{ animation: none; }
  }
</style>
</head>
<body>

<div id="particles"></div>

<div class="stage">
  <div class="card">

    <!-- OPENING -->
    <div class="screen active" id="screen-opening">
      <div id="opening-lines"></div>
      <div style="margin-top:20px;">
        <button class="primary" id="btn-start" style="display:none;">💗 Start</button>
      </div>
    </div>

    <!-- QUESTIONS -->
    <div class="screen" id="screen-question">
      <div class="progress" id="progress-dots"></div>
      <div class="question-number" id="q-number"></div>
      <div id="q-lead" class="line" style="min-height:1.6em;"></div>
      <div class="question-text" id="q-text"></div>
      <div class="btn-row" id="q-buttons"></div>
      <div class="reaction" id="q-reaction"></div>
    </div>

    <!-- TRANSITION -->
    <div class="screen" id="screen-transition">
      <div id="transition-lines"></div>
    </div>

    <!-- FINAL QUESTION -->
    <div class="screen" id="screen-final-question">
      <div class="question-text">What am I to you?</div>
      <textarea id="final-answer" placeholder="Tell me honestly..."></textarea>
      <div class="privacy-note">Your answers will be sent to me so I can read them ❤️</div>
      <div style="margin-top:20px;">
        <button class="primary" id="btn-send">💗 Send my answer</button>
      </div>
      <div id="send-status" style="margin-top:14px; font-size:0.95rem; color:var(--plum-soft);"></div>
    </div>

    <!-- POST SEND -->
    <div class="screen" id="screen-post-send">
      <div id="post-send-lines"></div>
      <div style="margin-top:24px;">
        <button class="primary" id="btn-open-gift" style="display:none;">🎁 Open it</button>
      </div>
    </div>

    <!-- ENVELOPE -->
    <div class="screen" id="screen-envelope">
      <div class="envelope-wrap">
        <div class="envelope" id="envelope">
          <div class="glow"></div>
          <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="18" width="188" height="112" rx="10" fill="#f7d9de" stroke="#eab8c3" stroke-width="2"/>
            <path d="M6 22 L100 92 L194 22" fill="none" stroke="#a5798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="100" cy="74" r="9" fill="#a5798d"/>
            <path d="M100 70 c-2,-4 -8,-4 -8,0 c0,3 4,5 8,8 c4,-3 8,-5 8,-8 c0,-4 -6,-4 -8,0 z" fill="#fdf6ee"/>
          </svg>
        </div>
      </div>
      <div class="line" style="opacity:1;">Tap the envelope 👀</div>
    </div>

    <!-- LETTER -->
    <div class="screen" id="screen-letter">
      <div class="letter" id="letter-body"></div>
      <div class="small-link" id="btn-one-more" style="display:none;">One last thing... 👀</div>
    </div>

    <!-- LAST QUESTION -->
    <div class="screen" id="screen-last-question">
      <div id="last-q-lines"></div>
      <div class="btn-row" id="last-q-buttons" style="display:none; margin-top:20px;"></div>
    </div>

    <!-- ENDING -->
    <div class="screen" id="screen-ending">
      <div id="ending-lines"></div>
    </div>

  </div>
</div>

<div class="music-toggle" id="music-toggle">🎵 Music On</div>
<audio id="song" loop preload="auto"></audio>

<script>
(function(){
  "use strict";

  const CFG = window.SITE_CONFIG;
  const answers = {};

  // ---------- particles ----------
  const particleLayer = document.getElementById('particles');
  const glyphs = ['❤️','💗','🌸','✨'];
  function spawnParticle(){
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const size = 12 + Math.random()*14;
    el.style.fontSize = size + 'px';
    el.style.left = Math.random()*100 + 'vw';
    const dur = 10 + Math.random()*10;
    el.style.animationDuration = dur + 's';
    particleLayer.appendChild(el);
    setTimeout(()=> el.remove(), dur*1000 + 500);
  }
  let particleInterval = setInterval(spawnParticle, 900);
  for(let i=0;i<6;i++) setTimeout(spawnParticle, i*300);

  function reduceParticles(rateMs){
    clearInterval(particleInterval);
    particleInterval = setInterval(spawnParticle, rateMs);
  }

  // ---------- screen management ----------
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------- helper: sequential lines ----------
  function typeLines(container, lines, opts){
    opts = opts || {};
    container.innerHTML = '';
    let delay = 0;
    const gap = opts.gap || 900;
    lines.forEach((text, i) => {
      const p = document.createElement('div');
      p.className = 'line';
      p.textContent = text;
      p.style.animationDelay = delay/1000 + 's';
      container.appendChild(p);
      delay += gap;
    });
    if(opts.onDone){
      setTimeout(opts.onDone, delay + 200);
    }
  }

  // ---------- OPENING ----------
  const openingLines = ["Hey you 👀", "I made this little thing because...", "I have a few questions for you."];
  typeLines(document.getElementById('opening-lines'), openingLines, {
    gap: 1100,
    onDone: () => { document.getElementById('btn-start').style.display = 'inline-block'; }
  });

  document.getElementById('btn-start').addEventListener('click', () => {
    startMusic();
    showScreen('screen-question');
    renderQuestion(0);
  });

  // ---------- QUESTIONS DATA ----------
  const questions = [
    {
      key: 'question1', lead: "First question...", text: "Did you smile when you opened this website?",
      options: [
        {label:"😊 Yes", value:"Yes", reaction:"Hehe... I knew it 😌❤️"},
        {label:"😐 Maybe", value:"Maybe", reaction:"Hmm... I'll accept that answer for now 🤨😂"}
      ]
    },
    {
      key: 'question2', lead: "Be honest...", text: "Am I one of your favorite people?",
      options: [
        {label:"💗 Yes", value:"Yes", reaction:"Awww... I like that answer 🥹❤️"},
        {label:"👀 Maybe...", value:"Maybe", reaction:"MAYBE?! 😭 Okay... noted."}
      ]
    },
    {
      key: 'question3', lead: "Okay, another important question...", text: "Do I make you happy?",
      options: [
        {label:"❤️ Yes", value:"Yes", reaction:"Good... because making you happy makes me happy too. ❤️"},
        {label:"🥹 Sometimes", value:"Sometimes", reaction:"I'll work on becoming your 'always.' ❤️"}
      ]
    },
    {
      key: 'question4', lead: "Okay... tell me this 👀", text: "Do you get happy when you see my notification?",
      options: [
        {label:"😭 Maybe", value:"Maybe", reaction:"I know that 'maybe' means yes 👀"},
        {label:"❤️ Yes", value:"Yes", reaction:"Okay... that made me smile 🥹❤️"}
      ]
    },
    {
      key: 'question5', lead: "Another honest question...", text: "Do you ever randomly think about me?",
      options: [
        {label:"👀 Maybe", value:"Maybe", reaction:"Again with the maybe?! 🤨😂"},
        {label:"🥹 Yes", value:"Yes", reaction:"Good... because I randomly think about you too. ❤️"}
      ]
    },
    {
      key: 'question6', lead: "Be completely honest now... 😳", text: "Do I ever make you blush?",
      options: [
        {label:"🙄 No", value:"No", reaction:"Hmmm... suspicious 🤨"},
        {label:"🙈 Maybe...", value:"Maybe", reaction:"That sounds like a yes to me 😌"},
        {label:"😳 Yes", value:"Yes", reaction:"Mission accomplished 😌❤️"}
      ]
    },
    {
      key: 'question7', lead: "Okay... this one is a little different.", text: "Do you miss me sometimes?",
      options: [
        {label:"👀 Maybe", value:"Maybe", reaction:"I'll pretend I didn't see that 👀"},
        {label:"🥹 Yes", value:"Yes", reaction:"I miss you too... probably more than I admit. ❤️"}
      ]
    },
    {
      key: 'question8', lead: "Getting a little serious now...", text: "Do you think I've become an important person in your life?",
      options: [
        {label:"❤️ Yes", value:"Yes", reaction:"That honestly means a lot to me. ❤️"},
        {label:"🥹 Very much", value:"Very much", reaction:"You have no idea how happy that makes me. 🥹❤️"}
      ]
    },
    {
      key: 'question9', lead: "Last cute question... 🌸", text: "Does having me in your life make things a little better?",
      options: [
        {label:"❤️ Yes", value:"Yes", reaction:"Then I'll always try to make things a little better for you. ❤️"},
        {label:"🥹 Definitely", value:"Definitely", reaction:"Good... because I want to be someone who adds happiness to your life. 🥹❤️"}
      ]
    }
  ];

  function renderProgress(index){
    const total = questions.length;
    let dots = '';
    for(let i=0;i<total;i++){
      dots += i < index ? '💗 ' : '🤍 ';
    }
    document.getElementById('progress-dots').textContent = dots.trim();
  }

  function renderQuestion(index){
    if(index >= questions.length){
      showScreen('screen-transition');
      runTransition();
      return;
    }
    const q = questions[index];
    renderProgress(index);
    document.getElementById('q-number').textContent = 'Question ' + (index+1) + ' of ' + questions.length;
    document.getElementById('q-lead').textContent = q.lead;
    const qTextEl = document.getElementById('q-text');
    qTextEl.style.opacity = 0;
    qTextEl.textContent = q.text;
    requestAnimationFrame(()=>{
      qTextEl.style.transition = 'opacity 0.6s ease';
      qTextEl.style.opacity = 1;
    });
    document.getElementById('q-reaction').textContent = '';

    const btnRow = document.getElementById('q-buttons');
    btnRow.innerHTML = '';
    q.options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = opt.label;
      b.addEventListener('click', () => {
        Array.from(btnRow.children).forEach(c => c.disabled = true);
        answers[q.key] = opt.value;
        const reactionEl = document.getElementById('q-reaction');
        reactionEl.style.animation = 'none';
        void reactionEl.offsetWidth;
        reactionEl.style.animation = '';
        reactionEl.textContent = opt.reaction;
        setTimeout(() => renderQuestion(index+1), 1500);
      });
      btnRow.appendChild(b);
    });
  }

  // ---------- TRANSITION ----------
  function runTransition(){
    reduceParticles(2500);
    const lines = ["Okay...", "Enough questions.", "But there is one thing I've genuinely wanted to know.", "So please...", "Tell me honestly."];
    typeLines(document.getElementById('transition-lines'), lines, {
      gap: 1200,
      onDone: () => {
        setTimeout(() => {
          showScreen('screen-final-question');
        }, 600);
      }
    });
  }

  // ---------- FINAL QUESTION / SEND ----------
  const sendBtn = document.getElementById('btn-send');
  const statusEl = document.getElementById('send-status');
  let sending = false;

  try {
    if (window.emailjs && CFG.EMAILJS_PUBLIC_KEY) {
      emailjs.init({ publicKey: CFG.EMAILJS_PUBLIC_KEY });
    }
  } catch(e){ /* ignore init errors until configured */ }

  sendBtn.addEventListener('click', () => {
    if(sending) return;
    const val = document.getElementById('final-answer').value.trim();
    if(!val){
      statusEl.textContent = 'Please write something first 💭';
      return;
    }
    answers.final_answer = val;
    sending = true;
    sendBtn.disabled = true;
    statusEl.innerHTML = '<span class="loader"></span> Sending...';

    const params = {
      question1: answers.question1 || '',
      question2: answers.question2 || '',
      question3: answers.question3 || '',
      question4: answers.question4 || '',
      question5: answers.question5 || '',
      question6: answers.question6 || '',
      question7: answers.question7 || '',
      question8: answers.question8 || '',
      question9: answers.question9 || '',
      final_answer: answers.final_answer,
      subject: "💌 She answered your questions!"
    };

    emailjs.send(CFG.EMAILJS_SERVICE_ID, CFG.EMAILJS_TEMPLATE_ID, params)
      .then(() => {
        statusEl.textContent = '';
        showScreen('screen-post-send');
        runPostSend();
      })
      .catch(() => {
        sending = false;
        sendBtn.disabled = false;
        statusEl.innerHTML = 'Something went wrong. <span style="text-decoration:underline; cursor:pointer;" id="retry-link">Try again</span>';
        const retry = document.getElementById('retry-link');
        if(retry){
          retry.addEventListener('click', () => { sendBtn.click(); });
        }
      });
  });

  // ---------- POST SEND ----------
  function runPostSend(){
    const lines = ["Thank you for answering me. ❤️", "Wait...", "I lied. 👀", "There is one more thing."];
    typeLines(document.getElementById('post-send-lines'), lines, {
      gap: 1300,
      onDone: () => { document.getElementById('btn-open-gift').style.display = 'inline-block'; }
    });
  }

  // ---------- MUSIC + ENVELOPE ----------
  const song = document.getElementById('song');
  const musicToggle = document.getElementById('music-toggle');
  let musicPlaying = false;

  function fadeVolume(audioEl, from, to, duration){
    const steps = 30;
    const stepTime = duration/steps;
    let i = 0;
    const interval = setInterval(() => {
      i++;
      audioEl.volume = from + (to-from) * (i/steps);
      if(i >= steps) clearInterval(interval);
    }, stepTime);
  }

  function startMusic(){
    if(musicPlaying) return;

    const firstStart = !song.src;
    if(firstStart){
      song.src = CFG.SONG_URL;
      song.volume = 0.35;
      song.load();
    }

    const playPromise = song.play();
    if(playPromise && playPromise.then){
      playPromise.then(() => {
        musicPlaying = true;
        musicToggle.textContent = '🎵 Music On';
        if(firstStart){ fadeVolume(song, 0.35, 0.35, 1); }
      }).catch((err) => {
        console.error('Audio playback failed:', err);
        musicToggle.textContent = '🔇 Tap Music';
      });
    }
  }

  song.addEventListener('error', () => {
    console.error('Audio file error:', song.error);
    musicToggle.textContent = '❌ Audio Error';
  });

  musicToggle.addEventListener('click', () => {
    if(musicPlaying){
      song.pause();
      musicToggle.textContent = '🔇 Music Off';
      musicPlaying = false;
    } else {
      startMusic();
    }
  });

  document.getElementById('btn-open-gift').addEventListener('click', () => {
    showScreen('screen-envelope');
  });

  document.getElementById('envelope').addEventListener('click', function(){
    this.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
    this.style.transform = 'scale(1.15) rotate(3deg)';
    this.style.opacity = '0';
    setTimeout(() => {
      showScreen('screen-letter');
      renderLetter();
    }, 500);
  });

  // ---------- LETTER ----------
  const letterParagraphs = [
"Heyy Mommy 😋",
"I know this was just a small website.",
"Just a few questions, some buttons, and a little box where you could type your answer.",
"But I hope you know that I didnt make this just to ask you what I am to you.",
"I made it because sometimes I wish I could show you how much you actually mean to me.",
"And words dont always feel enough.",
"So I thought",
"Maybe I could make you something.",
"Something small.",
"Something you could open and smile at.",
"Something that exists only because of you.",
"Every question you answered was something I genuinely wanted to know.",
"Because your thoughts matter to me.",
"Your happiness matters to me.",
"And honestly",
"You matter to me more than you probably realize.",
"I dont know what the future has planned for us.",
"But I do know one thing.",
"if I can make you smile",
"Make your bad days a little better",
"Or make you feel even a little more loved",
"Then I will always want to do that.",
"So this is just a small reminder.",
"You are special to me.",
"You are important to me.",
"And Im really, really happy that you are in my life.",
"And maybe this is just a small website today.",
"But I hope one day I can make memories with you that are much bigger than this.",
"Until then...",
"I'll keep finding little ways to make you smile.",
"Because seeing you happy",
"Might be one of my favorite things in the world.",
"❤️",
"I will always love you mommy 😋👉🏽👈🏽"
  ];

  const LETTER_COLORS = ['#c25c78','#a5798d','#8a5a72','#c9738f','#7a5468','#b06b8f','#9c5b76','#d9748d'];
  const LETTER_EMPHASIS = new Set([
    "You are special to me.",
    "You are important to me.",
    "And Im really, really happy that you are in my life.",
    "Then I will always want to do that."
  ]);

  function renderLetter(){
    const body = document.getElementById('letter-body');
    body.innerHTML = '';
    let delay = 0;

    const flourish = document.createElement('div');
    flourish.className = 'letter-flourish';
    flourish.textContent = '🌸 ❤️ 🌸';
    body.appendChild(flourish);
    delay += 500;

    letterParagraphs.forEach((text, i) => {
      const p = document.createElement('p');
      p.textContent = text;
      p.style.animationDelay = delay/1000 + 's';

      if(text === '❤️'){
        p.classList.add('letter-heart');
      } else if(text.indexOf('I will always love you mommy') === 0){
        p.classList.add('letter-signoff');
        p.style.color = '#c25c78';
      } else if(LETTER_EMPHASIS.has(text)){
        p.classList.add('letter-emphasis');
      } else {
        p.style.color = LETTER_COLORS[i % LETTER_COLORS.length];
      }

      body.appendChild(p);
      delay += 550;
    });
    setTimeout(() => {
      document.getElementById('btn-one-more').style.display = 'inline-block';
    }, delay + 400);
  }

  document.getElementById('btn-one-more').addEventListener('click', () => {
    showScreen('screen-last-question');
    runLastQuestion();
  });

  // ---------- LAST QUESTION ----------
  function runLastQuestion(){
    const lines = ["You answered all my questions...", "But you forgot something. 👀", "You never answered this one.", "Will you let me keep making you smile?"];
    typeLines(document.getElementById('last-q-lines'), lines, {
      gap: 1300,
      onDone: () => {
        document.getElementById('last-q-buttons').style.display = 'flex';
      }
    });

    const btnRow = document.getElementById('last-q-buttons');
    btnRow.innerHTML = '';
    ["💗 Yes, idiot.", "🥹 Of course."].forEach(label => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = label;
      b.addEventListener('click', runEnding);
      btnRow.appendChild(b);
    });
  }

  // ---------- ENDING ----------
  function runEnding(){
    showScreen('screen-ending');
    reduceParticles(300);
    const lines = ["❤️ Good.", "Because I'm not planning to stop."];
    typeLines(document.getElementById('ending-lines'), lines, { gap: 1400 });
  }

})();
</script>

</body>
</html>
